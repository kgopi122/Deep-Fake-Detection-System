services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - veritrue-network
    restart: unless-stopped

  fastapi-service:
    build:
      context: ./python-detector
      dockerfile: Dockerfile
    container_name: fastapi-service
    ports:
      - "${FASTAPI_PORT:-8001}:8001"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      # Persists downloaded Hugging Face weights on disk across restarts
      - hf_cache:/root/.cache/huggingface
    networks:
      - veritrue-network
    restart: unless-stopped

  springboot-backend:
    build:
      context: ./veritrue-backend
      dockerfile: Dockerfile
    container_name: springboot-backend
    ports:
      - "${SPRING_PORT:-8000}:8000"
    environment:
      # Inject Docker network URLs matching application.properties variables
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/Deep_Fake}
      - FASTAPI_URL=${FASTAPI_URL:-http://fastapi-service:8001}
    depends_on:
      - mongodb
      - fastapi-service
    networks:
      - veritrue-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - springboot-backend
    networks:
      - veritrue-network
    restart: unless-stopped

networks:
  veritrue-network:
    driver: bridge

volumes:
  mongodb_data:
  hf_cache: