[project]
name = "veritrue-detector"
version = "0.1.0"
description = "VeriTrue: modular AI-generated image detection pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "VeriTrue" }]

dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "pydantic>=2.6",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "requests>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
torch = ["torch>=2.1", "torchvision>=0.16"]

[project.scripts]
veritrue-detect = "veritrue_detector.cli:main"

[tool.ruff]
line-length = 100

[tool.pyright]
pythonVersion = "3.10"
reportMissingTypeStubs = false
