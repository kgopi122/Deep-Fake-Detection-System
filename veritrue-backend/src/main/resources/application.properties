spring.application.name=veritrue-backend
server.port=8000
spring.config.import=optional:file:.env[.properties]

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/veritrue}
fastapi.service.url=${FASTAPI_URL:http://localhost:8001}

# File Upload Limits (Critical for video/high-res image analysis)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Optional ONNX AI-generated image detector
# Provide an ONNX model path to enable model inference.
# Example: veritrue.onnx.modelPath=C:/models/aigc_detector.onnx
veritrue.onnx.enabled=false
veritrue.onnx.modelPath=
veritrue.onnx.inputWidth=224
veritrue.onnx.inputHeight=224
# Common input tensor names: "input", "images", "pixel_values" (depends on model)
veritrue.onnx.inputName=input
# If empty, we will use the model's first output.
veritrue.onnx.outputName=
veritrue.onnx.fakeIndex=1

# Preprocessing (defaults match common ImageNet models). If your model expects 0..1 only,
# set mean to 0,0,0 and std to 1,1,1.
veritrue.onnx.mean=0.485,0.456,0.406
veritrue.onnx.std=0.229,0.224,0.225

# Heuristic (non-ONNX) forensics tuning
# sensitivity: 0..1 (higher = more likely to flag AI-generated)
veritrue.forensics.sensitivity=0.50
# thresholds (0..100)
veritrue.forensics.suspiciousThreshold=65
veritrue.forensics.fakeThreshold=80
# weights used when ONNX is disabled/unavailable
veritrue.forensics.weightSignal=0.40
veritrue.forensics.weightPixels=0.45
veritrue.forensics.weightMetadata=0.15